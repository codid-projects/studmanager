trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  # Docker Registry service connection (Project settings -> Service connections)
  dockerRegistryConnection: DockerRegistry
  imageRepository: registry.studmarket.net/studmanager-web
  imageTag: $(Build.BuildId)
  dockerfilePath: Dockerfile
  buildContext: .
  # The browser talks to same-origin Next API routes. The server reads
  # STUDMANAGER_API_URL from the Portainer stack at runtime.
  apiMode: server

steps:
- task: DockerInstaller@0
  displayName: Install Docker
  inputs:
    dockerVersion: 24.0.7

- task: Docker@2
  displayName: Login to container registry
  inputs:
    command: login
    containerRegistry: $(dockerRegistryConnection)

- script: |
    docker build \
      -f "$(dockerfilePath)" \
      --build-arg NEXT_PUBLIC_STUDMANAGER_API_MODE="$(apiMode)" \
      -t "$(imageRepository):$(imageTag)" \
      -t "$(imageRepository):latest" \
      "$(buildContext)"
  displayName: Build Docker image

- script: |
    docker push "$(imageRepository):$(imageTag)"
    docker push "$(imageRepository):latest"
  displayName: Push Docker image

- task: Docker@2
  displayName: Logout from container registry
  condition: always()
  inputs:
    command: logout
    containerRegistry: $(dockerRegistryConnection)
